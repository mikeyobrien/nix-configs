# ABOUTME: Proxmox VM template configuration for coral k3s node
# ABOUTME: Defines VM specifications for cloning new k3s cluster nodes

# VM Template Configuration for Coral (k3s worker node)
# This configuration is used as a reference for creating VMs

# Basic VM Settings
name: nixos-k3s-template
vmid: 9000
ostype: l26  # Linux 2.6+ kernel
boot: order=scsi0

# CPU Configuration
cores: 4
sockets: 1
cpu: x86-64-v2-AES  # Modern CPU with AES support

# Memory Configuration
memory: 8192  # 8GB RAM
balloon: 4096  # Allow ballooning down to 4GB

# Storage Configuration
scsi0: local-lvm:100  # 100GB root disk
scsihw: virtio-scsi-single
bootdisk: scsi0

# Network Configuration
net0: virtio,bridge=vmbr1,firewall=1
# vmbr1 should be configured for k3s cluster network (10.10.20.0/24)

# Cloud-Init Configuration (for automation)
ide2: local-lvm:cloudinit
serial0: socket
vga: serial0

# QEMU Guest Agent
agent: enabled=1,fstrim_cloned_disks=1

# Template-specific settings
template: 1  # Mark as template after creation

# Cloud-init user data example
# This would be stored separately and applied during provisioning
ciuser: nixos
cipassword: <encrypted>  # Generated during provisioning
searchdomain: k3s.local
nameserver: 10.10.20.1
sshkeys: |
  # SSH keys added during provisioning from secrets

# Network configuration for coral specifically
# Static IP: 10.10.20.12/24
# Gateway: 10.10.20.1
# DNS: 10.10.20.1

# Notes for template creation:
# 1. Create VM with above specifications
# 2. Install minimal NixOS 24.05
# 3. Install cloud-init and qemu-guest-agent
# 4. Configure cloud-init for NixOS
# 5. Clean up and prepare for cloning
# 6. Convert to template: qm template 9000

# Cloning example:
# qm clone 9000 9002 --name coral --full
# qm set 9002 --ipconfig0 ip=10.10.20.12/24,gw=10.10.20.1